name: Daily Model Retrain

on:
  schedule:
    # Daily at 3:00 AM UTC (adjust as needed)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      model_type:
        description: 'Model type to train (LSTM, XGBoost, etc.)'
        required: false
        default: 'LSTM'

concurrency:
  group: daily-retrain
  cancel-in-progress: true

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/retrain/requirements.txt

      - name: Fetch latest market data
        env:
          YAHOO_FINANCE_API_KEY: ${{ secrets.YAHOO_FINANCE_API_KEY }}
          DATA_STORAGE: local
        run: |
          python scripts/retrain/fetch_data.py \
            --output data/latest_market_data.csv \
            --lookback-days 365 \
            --symbols AAPL,BTC,ETH

      - name: Run training pipeline
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          EXPERIMENT_API_KEY: ${{ secrets.EXPERIMENT_API_KEY }}
          DASHBOARD_API_URL: ${{ secrets.DASHBOARD_API_URL }}
          MODEL_TYPE: ${{ github.event.inputs.model_type || 'LSTM' }}
        run: |
          python scripts/retrain/train_and_upload.py \
            --data-path data/latest_market_data.csv \
            --model-type ${MODEL_TYPE} \
            --checkpoint-dir checkpoints/ \
            --output-dir output/ \
            --log-to-wandb \
            --log-experiments \
            --threshold-accuracy 0.55 \
            --threshold-improvement 0.01

      - name: Upload trained model artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: trained-model-${{ github.run_id }}
          path: output/model.onnx
          retention-days: 30

      - name: Upload checkpoint artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-${{ github.run_id }}
          path: checkpoints/
          retention-days: 7

      - name: Notify success
        if: success()
        run: |
          echo "✅ Daily retrain completed successfully"
          echo "Model artifact: trained-model-${{ github.run_id }}"

      - name: Notify failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Daily model retrain failed. Check workflow logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            })
